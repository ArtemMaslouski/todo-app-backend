version: "3.8"

services:
  # Сервис с базой данных
  db:
    image: postgres:15-alpine
    container_name: todo_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Том для сохранения данных (чтобы база не очищалась при перезапуске)
volumes:
  postgres_data:
